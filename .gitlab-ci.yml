stages:
  - build

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  CARGO_TARGET_DIR: $CI_PROJECT_DIR/desktop/src-tauri/target
  NODE_OPTIONS: --max-old-space-size=4096

cache:
  key: ${CI_JOB_IMAGE}
  paths:
    - .cargo/
    - desktop/src-tauri/target/
    - desktop/web/node_modules/

.common_setup: &common_setup
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq
        build-essential curl wget file pkg-config
        libssl-dev libgtk-3-dev librsvg2-dev
        libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev
        libsoup-3.0-dev 2>&1 | tail -3
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    - apt-get install -y -qq nodejs 2>&1 | tail -3
    - cd desktop/web && npm ci && cd ../../

build:deb:
  stage: build
  image: ubuntu:24.04
  <<: *common_setup
  script:
    - apt-get install -y -qq libayatana-appindicator3-dev 2>&1 | tail -1
    - cd desktop
    - npx --prefix web tauri build --bundles deb,appimage
  artifacts:
    name: "aiden-desktop-${CI_COMMIT_SHORT_SHA}-deb"
    paths:
      - desktop/src-tauri/target/release/bundle/
    expire_in: 30 days

build:rpm:
  stage: build
  image: fedora:40
  before_script:
    - dnf install -y -q
        gcc-c++ file pkg-config openssl-devel
        gtk3-devel webkit2gtk4.1-devel
        librsvg2-devel libsoup3-devel
        libappindicator-gtk3-devel
        nodejs npm rustup 2>&1 | tail -3
    - rustup default stable
    - cd desktop/web && npm ci && cd ../../
  script:
    - cd desktop
    - npx --prefix web tauri build --bundles rpm,appimage
  artifacts:
    name: "aiden-desktop-${CI_COMMIT_SHORT_SHA}-rpm"
    paths:
      - desktop/src-tauri/target/release/bundle/
    expire_in: 30 days

build:macos:
  stage: build
  tags:
    - macos
  only:
    - tags
  before_script:
    - brew install node rust 2>&1 | tail -3
    - cd desktop/web && npm ci && cd ../../
  script:
    - cd desktop
    - npx --prefix web tauri build --bundles dmg
  artifacts:
    name: "aiden-desktop-${CI_COMMIT_SHORT_SHA}-macos"
    paths:
      - desktop/src-tauri/target/release/bundle/
    expire_in: 30 days
