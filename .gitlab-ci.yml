stages:
  - build
  - package
  - release

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  CARGO_TARGET_DIR: $CI_PROJECT_DIR/desktop/src-tauri/target
  NODE_OPTIONS: --max-old-space-size=4096

.default_cache: &default_cache
  key: ${CI_JOB_IMAGE}
  paths:
    - .cargo/
    - desktop/src-tauri/target/
    - desktop/web/node_modules/

# ── Build: produce binary + native bundles on Ubuntu ─────────────────

build:binary:
  stage: build
  image: ubuntu:24.04
  cache:
    <<: *default_cache
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq build-essential curl wget file pkg-config
      libssl-dev libgtk-3-dev librsvg2-dev libwebkit2gtk-4.1-dev
      libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libayatana-appindicator3-dev
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    - apt-get install -y -qq nodejs
    - rustup default stable 2>/dev/null || true
  script:
    - cd desktop/web && npm ci --silent && cd ../..
    - cd desktop && npx --prefix web tauri build --bundles deb,appimage && cd ..
  artifacts:
    name: "aiden-desktop-binary-${CI_COMMIT_SHORT_SHA}"
    paths:
      - desktop/src-tauri/target/release/aiden-desktop
      - desktop/src-tauri/target/release/bundle/
    expire_in: 30 days

# ── Package helpers (tagged releases or manual on master) ────────────

.package_base: &package_base
  stage: package
  needs: ["build:binary"]
  artifacts:
    name: "${CI_JOB_NAME}-${CI_COMMIT_SHORT_SHA}"
    paths:
      - packaging/out/
    expire_in: 90 days
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual

# ── Distro package jobs ──────────────────────────────────────────────

package:rpm:
  image: fedora:40
  <<: *package_base
  before_script:
    - dnf install -y -q rpmdevtools gcc-c++ file pkg-config openssl-devel gtk3-devel webkit2gtk4.1-devel librsvg2-devel libsoup3-devel libappindicator-gtk3-devel nodejs npm rustup
    - rustup default stable
  script:
    - mkdir -p packaging/out
    - cd desktop/web && npm ci --silent && npm run build --silent && cd ../..
    - cd desktop && npx --prefix web tauri build --bundles rpm && cd ..
    - cp desktop/src-tauri/target/release/bundle/rpm/*.rpm packaging/out/ 2>/dev/null || true

package:arch:
  image: archlinux:latest
  stage: package
  needs: ["build:binary"]
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  cache:
    key: archlinux:latest
    paths:
      - .cargo/
      - desktop/src-tauri/target/
      - desktop/web/node_modules/
  before_script:
    - 'pacman -Syu --noconfirm && pacman -S --noconfirm base-devel cargo npm nodejs python webkit2gtk-4.1 libappindicator-gtk3 librsvg && useradd -m builder && echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder'
  script:
    - mkdir -p packaging/out
    - chown -R builder:builder .
    - sudo -u builder bash -c "cd desktop/web && npm ci --silent && npm run build --silent && cd ../.. && cd desktop && cargo tauri build --bundles deb && cd .."
    - cp packaging/arch/PKGBUILD packaging/out/
    - cp desktop/src-tauri/target/release/aiden-desktop packaging/out/
  artifacts:
    name: "${CI_JOB_NAME}-${CI_COMMIT_SHORT_SHA}"
    paths:
      - packaging/out/
    expire_in: 90 days

package:flatpak:
  image: ubuntu:24.04
  <<: *package_base
  before_script:
    - apt-get update -qq && apt-get install -y -qq flatpak flatpak-builder python3 python3-pip
    - flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
    - flatpak install --user -y org.gnome.Platform//47 org.gnome.Sdk//47
  script:
    - mkdir -p packaging/out
    - flatpak-builder --force-clean --repo=packaging/out/flatpak-repo packaging/flatpak-build packaging/flatpak/org.acreetionos.Aiden.json
    - flatpak build-bundle packaging/out/flatpak-repo packaging/out/aiden-desktop.flatpak org.acreetionos.Aiden

package:alpine:
  image: alpine:latest
  <<: *package_base
  before_script:
    - apk add --no-cache alpine-sdk cargo npm nodejs python3
      gtk+3.0-dev webkit2gtk-4.1-dev librsvg-dev openssl-dev curl-dev sudo
  script:
    - mkdir -p packaging/out
    - cd desktop/web && npm ci --silent && npm run build --silent && cd ../..
    - cd desktop && cargo tauri build --bundles deb && cd ..
    - cp packaging/alpine/APKBUILD packaging/out/
    - cp desktop/src-tauri/target/release/aiden-desktop packaging/out/

package:void:
  image: ghcr.io/void-linux/void-linux:latest
  <<: *package_base
  before_script:
    - xbps-install -Syu -y
    - xbps-install -y base-devel cargo npm nodejs python3
      gtk+3-devel webkit2gtk-4.1-devel librsvg-devel
  script:
    - mkdir -p packaging/out
    - cd desktop/web && npm ci --silent && npm run build --silent && cd ../..
    - cd desktop && cargo tauri build --bundles deb && cd ..
    - cp packaging/void/template.py packaging/out/
    - cp desktop/src-tauri/target/release/aiden-desktop packaging/out/

package:opensuse:
  image: opensuse/tumbleweed:latest
  <<: *package_base
  before_script:
    - zypper --gpg-auto-import-keys ref
    - zypper install -y -l gcc-c++ rpm-build file pkg-config libopenssl-devel
      gtk3-devel webkit2gtk-4_1-devel librsvg-devel libsoup3-devel
      libappindicator-gtk3-devel nodejs npm rustup
    - rustup default stable 2>/dev/null || true
  script:
    - mkdir -p packaging/out
    - cd desktop/web && npm ci --silent && npm run build --silent && cd ../..
    - cd desktop && npx --prefix web tauri build --bundles rpm && cd ..
    - cp desktop/src-tauri/target/release/bundle/rpm/*.rpm packaging/out/ 2>/dev/null || true

package:nix:
  image: nixos/nix:latest
  <<: *package_base
  before_script:
    - nix-channel --update
  script:
    - mkdir -p packaging/out
    - nix-build packaging/nix/default.nix -o packaging/out/nix-result
    - cp -r packaging/out/nix-result/* packaging/out/ 2>/dev/null || true

# ── Release: publish to GitLab Releases ──────────────────────────────

release:
  stage: release
  image: alpine:latest
  needs:
    - build:binary
    - package:rpm
    - package:arch
    - package:flatpak
    - package:alpine
    - package:void
    - package:opensuse
  rules:
    - if: $CI_COMMIT_TAG
  variables:
    GIT_STRATEGY: none
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      curl --header "PRIVATE-TOKEN: ${CI_JOB_TOKEN}" \
        --request POST \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases" \
        --data "{
          \"name\": \"AIDEN Desktop ${CI_COMMIT_TAG}\",
          \"tag_name\": \"${CI_COMMIT_TAG}\",
          \"description\": \"Automated release from pipeline ${CI_PIPELINE_ID}\"
        }"
